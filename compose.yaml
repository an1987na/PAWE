services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pawe
      POSTGRES_USER: pawe
      POSTGRES_PASSWORD: ${PAWE_POSTGRES_PASSWORD:-pawe-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawe -d pawe"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pawe_postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PAWE_DATABASE_URL: postgresql+asyncpg://pawe:${PAWE_POSTGRES_PASSWORD:-pawe-local-only}@postgres:5432/pawe
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PAWE_DATABASE_URL: postgresql+asyncpg://pawe:${PAWE_POSTGRES_PASSWORD:-pawe-local-only}@postgres:5432/pawe
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:4173:4173"

volumes:
  pawe_postgres:
