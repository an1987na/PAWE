name: 功能建议
description: 提议范围明确、可验证的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户目标、当前限制和适用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明范围、主要流程和必要边界。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容、验证与回退
      description: 说明对规则、数据、API、数据库、任务、权限和现有用户的影响。
    validations:
      required: true
